name: Stash
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  Stash:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Stash
        excludes:
          - "App/Info.plist"
      - path: Shared
    info:
      path: Stash/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    # App Group entitlement, added to try the Share Extension (see ShareExtension target below).
    # TRYING THIS ON A FREE APPLE ID: PriceTrack's iCloud attempt showed free "Personal Team"
    # accounts can't provision some capabilities at all — App Groups might hit the same wall.
    # If Xcode shows a signing error like the iCloud one, the rollback is: delete this
    # `entitlements:` block and the whole `ShareExtension` target below, and remove the
    # `dependencies:` line under Stash — that returns the app to its previous working state.
    entitlements:
      path: Stash/App/Stash.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.com.akshay.stash"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.stash
        PRODUCT_NAME: Stash
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShareExtension
        embed: true
    scheme:
      gatherCoverageData: false

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
      - path: Stash/Models
      - path: Stash/Services/LinkMetadataService.swift
      - path: Stash/Extensions/Color+Hex.swift
      - path: Stash/Extensions/UIImage+Compress.swift
      - path: Stash/DesignSystem
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Save to Stash
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.com.akshay.stash"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.stash.ShareExtension
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
